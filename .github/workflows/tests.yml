name: Tests

on:
  push:
    branches: [main]
    paths:
      - "Strobe/**"
      - "StrobeShare/**"
      - "StrobeTests/**"
      - "StrobeWidget/**"
      - "Strobe.xcodeproj/**"
      - "PrivacyInfo.xcprivacy"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "Strobe/**"
      - "StrobeShare/**"
      - "StrobeTests/**"
      - "StrobeWidget/**"
      - "Strobe.xcodeproj/**"
      - "PrivacyInfo.xcprivacy"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-ios:
    name: iOS Tests
    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      # Runner images don't always ship the same pre-created simulators
      # (hardcoding a device name broke when an image update dropped it),
      # so pick any available iPhone — and create one if none exist.
      - name: Select iOS simulator
        id: simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          UDID=$(python3 - <<'EOF'
          import json
          import subprocess

          def simctl(*args):
              return json.loads(subprocess.check_output(["xcrun", "simctl", "list", *args, "--json"]))

          def ios_version(identifier):
              # com.apple.CoreSimulator.SimRuntime.iOS-26-4 -> (26, 4)
              suffix = identifier.rsplit(".iOS-", 1)[-1]
              return tuple(int(part) for part in suffix.split("-") if part.isdigit())

          # Prefer an iPhone on the NEWEST installed iOS runtime — the devices
          # dict is keyed by runtime identifier with no ordering guarantee.
          # Skip the iPhone Duo: its first boot stalled xcodebuild for 6–8
          # minutes and pushed the job past its timeout.
          devices = simctl("devices", "available")["devices"]
          udid = None
          for key in sorted((k for k in devices if ".iOS-" in k), key=ios_version, reverse=True):
              iphones = [
                  d for d in devices[key]
                  if d.get("isAvailable")
                  and d["name"].startswith("iPhone")
                  and "Duo" not in d["name"]
              ]
              if iphones:
                  udid = iphones[0]["udid"]
                  break

          if udid is None:
              device_types = [
                  t["identifier"]
                  for t in simctl("devicetypes")["devicetypes"]
                  if t["identifier"].rsplit(".", 1)[-1].startswith("iPhone")
                  and "Duo" not in t["identifier"]
              ]
              runtimes = sorted(
                  (r["identifier"]
                   for r in simctl("runtimes")["runtimes"]
                   if r.get("isAvailable") and ".iOS-" in r["identifier"]),
                  key=ios_version,
              )
              udid = subprocess.check_output(
                  ["xcrun", "simctl", "create", "CI iPhone", device_types[-1], runtimes[-1]]
              ).decode().strip()

          print(udid)
          EOF
          )
          echo "Selected simulator: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          # Start booting now so the slow simulator boot overlaps the build
          # phase instead of serializing after it — `simctl boot` returns as
          # soon as the boot is underway, and xcodebuild attaches to a
          # booting/booted device without restarting it. This was the silent
          # multi-minute gap after the build finished.
          xcrun simctl boot "$UDID" || true

      - name: Run tests
        run: |
          set -o pipefail
          # Parallel testing makes xcodebuild boot a fresh *clone* of the
          # destination (log: "Clone 1 of iPhone 17 Pro"), discarding the
          # pre-booted device — and with a single unit-test bundle it only
          # ever creates one worker anyway. Run directly on the booted sim.
          xcodebuild test \
            -project Strobe.xcodeproj \
            -scheme Strobe \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            -skipPackagePluginValidation \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: TestResults-iOS
          path: TestResults.xcresult

  test-macos:
    name: macOS Tests
    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Strobe.xcodeproj \
            -scheme Strobe \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults-macOS.xcresult \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: TestResults-macOS
          path: TestResults-macOS.xcresult
